<!-- 深色主题 index.html -->
<!doctype html>
<html lang="zh-CN" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>分镜狮</title>
        <link
            rel="icon"
            type="image/png"
            href="{{ url_for('static', filename='favicon-96x96.png') }}"
            sizes="96x96"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="{{ url_for('static', filename='favicon.svg') }}"
        />
        <link
            rel="shortcut icon"
            href="{{ url_for('static', filename='favicon.ico') }}"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="{{ url_for('static', filename='apple-touch-icon.png') }}"
        />
        <link
            rel="manifest"
            href="{{ url_for('static', filename='site.webmanifest') }}"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('static', filename='main.css') }}"
            rel="stylesheet"
        />
    </head>
    <body>
        <!-- 工具侧边栏（垂直小图标） -->
        <div id="toolSidebar" class="tool-sidebar">
            <button
                class="btn btn-dark tool-btn"
                type="button"
                title="快捷访问"
                data-bs-toggle="tooltip"
                data-bs-placement="right"
                data-target="quick-access"
            >
                ★
            </button>
            <button
                class="btn btn-dark tool-btn"
                type="button"
                title="历史记录"
                data-bs-toggle="tooltip"
                data-bs-placement="right"
                data-target="history-window"
            >
                🕒
            </button>
            <button
                class="btn btn-dark tool-btn"
                type="button"
                title="插件设置"
                id="pluginSettingsBtn"
            >
                ⚙️
            </button>
        </div>
        <div class="container my-4">
            <!-- 标题 + 影片选择器 + 标签 -->
            <div class="d-flex flex-column mb-4">
                <div
                    class="d-flex justify-content-between align-items-start mb-4"
                >
                    <div class="d-flex align-items-center gap-3">
                        <h1 class="mb-0">🦁 分镜狮</h1>
                        <!-- 影片选择器 -->
                        <div class="dropdown" id="filmSelector">
                            <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <span class="current-film-name">加载中...</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-dark">
                                <!-- 动态填充 -->
                            </ul>
                        </div>
                    </div>
                    <!-- 顶部标签（选项卡） -->
                    <ul class="nav nav-tabs ms-4" id="topTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button
                                class="nav-link active"
                                id="quick-gen-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#quick-gen"
                                type="button"
                                role="tab"
                                aria-controls="quick-gen"
                                aria-selected="true"
                            >
                                快速生图
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button
                                class="nav-link"
                                id="image-split-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#image-split"
                                type="button"
                                role="tab"
                                aria-controls="image-split"
                                aria-selected="false"
                            >
                                图片编辑
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button
                                class="nav-link"
                                id="storyboard-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#storyboard"
                                type="button"
                                role="tab"
                                aria-controls="storyboard"
                                aria-selected="false"
                            >
                                故事板
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
            <!-- Tab 内容 -->
            <div class="tab-content" id="topTabsContent">
                <!-- Tab 内容区域 -->
                <div class="tab-content" id="topTabsContent">
                    <!-- 快速生图（当前页面内容） -->
                    <div
                        class="tab-pane fade show active"
                        id="quick-gen"
                        role="tabpanel"
                        aria-labelledby="quick-gen-tab"
                    >
                        <!-- 原有的左右两栏布局 -->
                        <div class="row">
                            <!-- 表单 -->
                            <div class="col-lg-6">
                                <!-- 你原来的上传和参数卡片 -->
                                <div class="card mb-4">
                                    <div class="card-header">
                                        上传参考图（最多10张）
                                    </div>
                                    <div class="card-body">
                                        <!-- 隐藏原生 input -->
                                        <input
                                            type="file"
                                            id="imageUpload"
                                            multiple
                                            accept="image/*"
                                            class="d-none"
                                        />

                                        <!-- 拖拽上传区域 -->
                                        <div
                                            id="dropZone"
                                            class="dashed-upload text-center py-4 mb-2"
                                        >
                                            <div class="text-muted">
                                                📁 拖拽图片至此，或
                                                <u>点击上传</u>
                                            </div>
                                        </div>

                                        <!-- 上传进度条（初始隐藏） -->
                                        <div
                                            id="uploadProgress"
                                            class="mt-2"
                                            style="display: none"
                                        >
                                            <div
                                                class="progress"
                                                style="height: 8px"
                                            >
                                                <div
                                                    class="progress-bar progress-bar-striped progress-bar-animated"
                                                    role="progressbar"
                                                    style="width: 0%"
                                                ></div>
                                            </div>
                                            <small class="text-muted"
                                                >上传中...</small
                                            >
                                        </div>

                                        <!-- 图片预览 -->
                                        <ul
                                            id="uploadPreview"
                                            class="d-flex flex-wrap gap-2 p-0 m-0"
                                        ></ul>
                                    </div>
                                </div>

                                <div class="card mb-4">
                                    <div class="card-header">生成参数</div>
                                    <div class="card-body">
                                        <div class="mb-3">
                                            <label class="form-label"
                                                >分辨率</label
                                            >
                                            <select
                                                id="resolution"
                                                class="form-select"
                                            >
                                                <option value="1K">1K</option>
                                                <option value="2K" selected>
                                                    2K
                                                </option>
                                                <option value="4K">4K</option>
                                            </select>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label"
                                                >长宽比</label
                                            >
                                            <select
                                                id="aspectRatio"
                                                class="form-select"
                                            >
                                                <option value="auto">
                                                    Auto
                                                </option>
                                                <option value="1:1">1:1</option>
                                                <option value="16:9">
                                                    16:9
                                                </option>
                                                <option value="9:16">
                                                    9:16
                                                </option>
                                                <option value="4:3">4:3</option>
                                                <option value="3:4">3:4</option>
                                                <option value="3:2">3:2</option>
                                                <option value="2:3">2:3</option>
                                                <option value="5:4">5:4</option>
                                                <option value="4:5">4:5</option>
                                                <option value="21:9">
                                                    21:9
                                                </option>
                                            </select>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label"
                                                >提示词模式</label
                                            >
                                            <div class="form-check">
                                                <input
                                                    class="form-check-input"
                                                    type="radio"
                                                    name="mode"
                                                    id="modeRaw"
                                                    value="raw"
                                                    checked
                                                />
                                                <label
                                                    class="form-check-label"
                                                    for="modeRaw"
                                                    >Raw 模式</label
                                                >
                                            </div>
                                            <div class="form-check">
                                                <input
                                                    class="form-check-input"
                                                    type="radio"
                                                    name="mode"
                                                    id="modeStoryboard"
                                                    value="storyboard"
                                                />
                                                <label
                                                    class="form-check-label"
                                                    for="modeStoryboard"
                                                    >分镜模式</label
                                                >
                                            </div>
                                            <div class="form-check">
                                                <input
                                                    class="form-check-input"
                                                    type="radio"
                                                    name="mode"
                                                    id="modeCharacter"
                                                    value="character"
                                                />
                                                <label
                                                    class="form-check-label"
                                                    for="modeCharacter"
                                                    >角色模式</label
                                                >
                                            </div>
                                        </div>

                                        <div id="rawSection">
                                            <textarea
                                                id="promptRaw"
                                                class="form-control"
                                                rows="4"
                                                placeholder="请输入提示词..."
                                            ></textarea>
                                        </div>
                                        <div
                                            id="storyboardSection"
                                            style="display: none"
                                        >
                                            <input
                                                type="text"
                                                id="prePrompt"
                                                class="form-control mb-2"
                                                placeholder="前提描述"
                                            />
                                            <input
                                                type="text"
                                                id="style"
                                                class="form-control mb-2"
                                                placeholder="风格"
                                            />
                                            <textarea
                                                id="shot1"
                                                class="form-control mb-2"
                                                placeholder="分镜一"
                                            ></textarea>
                                            <textarea
                                                id="shot2"
                                                class="form-control mb-2"
                                                placeholder="分镜二"
                                            ></textarea>
                                            <textarea
                                                id="shot3"
                                                class="form-control mb-2"
                                                placeholder="分镜三"
                                            ></textarea>
                                            <textarea
                                                id="shot4"
                                                class="form-control"
                                                placeholder="分镜四"
                                            ></textarea>
                                        </div>
                                        <div
                                            id="characterSection"
                                            style="display: none"
                                        >
                                            <div class="mb-3">
                                                <label class="form-label"
                                                    >角色视角（可多选）</label
                                                >
                                                <div class="form-check">
                                                    <input
                                                        class="form-check-input"
                                                        type="checkbox"
                                                        id="viewFront"
                                                        value="正面全身"
                                                    />
                                                    <label
                                                        class="form-check-label"
                                                        for="viewFront"
                                                        >正面全身</label
                                                    >
                                                </div>
                                                <div class="form-check">
                                                    <input
                                                        class="form-check-input"
                                                        type="checkbox"
                                                        id="viewSide"
                                                        value="侧面全身"
                                                    />
                                                    <label
                                                        class="form-check-label"
                                                        for="viewSide"
                                                        >侧面全身</label
                                                    >
                                                </div>
                                                <div class="form-check">
                                                    <input
                                                        class="form-check-input"
                                                        type="checkbox"
                                                        id="viewBack"
                                                        value="背面全身"
                                                    />
                                                    <label
                                                        class="form-check-label"
                                                        for="viewBack"
                                                        >背面全身</label
                                                    >
                                                </div>
                                                <div class="form-check">
                                                    <input
                                                        class="form-check-input"
                                                        type="checkbox"
                                                        id="viewFace"
                                                        value="面部特写"
                                                    />
                                                    <label
                                                        class="form-check-label"
                                                        for="viewFace"
                                                        >面部特写</label
                                                    >
                                                </div>
                                                <hr />
                                                <div class="form-check">
                                                    <input
                                                        class="form-check-input"
                                                        type="checkbox"
                                                        id="viewSolidBg"
                                                        value="纯色背景"
                                                        checked
                                                    />
                                                    <label
                                                        class="form-check-label"
                                                        for="viewSolidBg"
                                                        >纯色背景</label
                                                    >
                                                </div>
                                            </div>

                                            <div class="mb-3">
                                                <label class="form-label"
                                                    >其他说明（风格/姿态）</label
                                                >
                                                <textarea
                                                    id="characterNotes"
                                                    class="form-control"
                                                    rows="2"
                                                    placeholder="例如：日系二次元，站姿自然，表情温和..."
                                                ></textarea>
                                            </div>
                                        </div>

                                        <div class="mt-3">
                                            <label class="form-label"
                                                >提示词预览</label
                                            >
                                            <div
                                                id="promptPreview"
                                                class="alert alert-secondary"
                                                style="
                                                    white-space: pre-wrap;
                                                    min-height: 60px;
                                                "
                                            ></div>
                                        </div>

                                        <button
                                            id="generateBtn"
                                            class="btn btn-primary w-100 mt-3"
                                        >
                                            生成图片
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- 预览 -->
                            <div class="col-lg-6">
                                <div class="card">
                                    <div class="card-header">生成预览</div>
                                    <div
                                        class="card-body preview-container"
                                        id="generatedPreview"
                                    >
                                        <p class="text-muted">
                                            点击"生成图片"后，预览将显示在此处。
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 图片编辑 -->
                    <div
                        class="tab-pane fade"
                        id="image-split"
                        role="tabpanel"
                        aria-labelledby="image-split-tab"
                    >
                        <!-- 在"图片编辑" Tab 的工具栏中 -->
                        <div
                            class="d-flex justify-content-between align-items-center mb-3"
                        >
                            <h5 class="mb-0">图片编辑</h5>
                            <div class="d-flex gap-2">
                                <!-- 编辑模式选择 -->
                                <select
                                    id="editMode"
                                    class="form-select form-select-sm"
                                    style="width: auto"
                                >
                                    <option value="crop">裁剪模式</option>
                                    <option value="region">区域编辑</option>
                                </select>
                                <!-- 裁剪模式子选项 -->
                                <select
                                    id="cropMode"
                                    class="form-select form-select-sm crop-mode-option"
                                    style="width: auto"
                                >
                                    <option value="quadrants">四格裁剪</option>
                                    <option value="free">自由裁剪</option>
                                </select>
                                <!-- 区域编辑子选项 -->
                                <select
                                    id="regionAspectRatio"
                                    class="form-select form-select-sm region-mode-option d-none"
                                    style="width: auto"
                                >
                                    <option value="1:1">1:1</option>
                                    <option value="16:9" selected>16:9</option>
                                    <option value="9:16">9:16</option>
                                    <option value="4:3">4:3</option>
                                    <option value="3:4">3:4</option>
                                    <option value="3:2">3:2</option>
                                    <option value="2:3">2:3</option>
                                    <option value="21:9">21:9</option>
                                </select>
                                <button
                                    id="cropToQuadrantsBtn"
                                    class="btn btn-success btn-sm me-2 crop-mode-option"
                                    disabled
                                >
                                    裁剪
                                </button>
                                <button
                                    id="startRegionEditBtn"
                                    class="btn btn-warning btn-sm me-2 region-mode-option d-none"
                                    disabled
                                >
                                    选取区域
                                </button>
                                <button
                                    id="regionEditActionBtn"
                                    class="btn btn-info btn-sm me-2 d-none"
                                    disabled
                                >
                                    编辑区域
                                </button>
                                <button
                                    id="saveCroppedImagesBtn"
                                    class="btn btn-primary btn-sm"
                                    disabled
                                >
                                    保存
                                </button>
                                <button
                                    id="clearCanvasBtn"
                                    class="btn btn-outline-danger btn-sm"
                                    title="清空画布，恢复初始状态"
                                >
                                    🗑️ 清空
                                </button>
                            </div>
                        </div>

                        <!-- 编辑区域容器 -->
                        <div
                            id="imageEditContainer"
                            class="position-relative border rounded bg-dark-subtle"
                            style="width: 100%; height: 70vh"
                        >
                            <!-- 占位提示（初始显示） -->
                            <div
                                id="imageEditPlaceholder"
                                class="d-flex justify-content-center align-items-center h-100 w-100 text-muted"
                                style="position: absolute; inset: 0; z-index: 1"
                            >
                                请拖入一张图片以开始编辑
                            </div>

                            <!-- Canvas（始终存在，但初始无内容） -->
                            <canvas
                                id="editCanvas"
                                class="w-100 h-100"
                                style="display: block; background: #121212"
                            ></canvas>

                            <!-- 隐藏的图片加载器 -->
                            <img
                                id="hiddenImageLoader"
                                style="display: none"
                                crossorigin="anonymous"
                            />
                        </div>

                        <!-- 编辑结果面板 -->
                        <div id="regionEditResultsPanel" class="mt-3" style="display: none;">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="mb-0 text-light">编辑结果</h6>
                                <button id="applyRegionEditBtn" class="btn btn-sm btn-success" disabled>
                                    应用当前结果
                                </button>
                            </div>
                            <div id="regionEditResultsList" class="d-flex flex-wrap gap-2">
                                <!-- 编辑结果缩略图将显示在这里 -->
                            </div>
                        </div>
                    </div>

                    <!-- 故事板 -->
                    <div
                        class="tab-pane fade"
                        id="storyboard"
                        role="tabpanel"
                        aria-labelledby="storyboard-tab"
                    >
                        <!-- 顶部工具栏 -->
                        <div
                            class="d-flex justify-content-between align-items-center mb-3"
                        >
                            <div class="d-flex align-items-center gap-2 mb-0">
                                <!-- 可编辑标题 -->
                                <div
                                    class="storyboard-title-container d-flex align-items-center"
                                >
                                    <div
                                        class="storyboard-title-display d-flex align-items-center"
                                    >
                                        <span id="storyboardTitleText"
                                            >未命名故事板</span
                                        >
                                        <button
                                            id="editTitleBtn"
                                            class="btn btn-link text-light p-0 ms-2"
                                            style="
                                                font-size: 0.9em;
                                                opacity: 0.6;
                                            "
                                            title="重命名"
                                        >
                                            ✏️
                                        </button>
                                    </div>
                                    <input
                                        type="text"
                                        id="storyboardTitleInput"
                                        class="form-control form-control-sm d-none"
                                        value="未命名故事板"
                                        style="
                                            width: auto;
                                            min-width: 120px;
                                            display: inline-block;
                                        "
                                    />
                                </div>
                                <!-- 下拉按钮 -->
                                <div class="dropdown">
                                    <button
                                        class="btn btn-sm btn-outline-secondary"
                                        type="button"
                                        id="storyboardDropdownBtn"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false"
                                        style="padding: 0.25rem 0.5rem"
                                    >
                                        ▼
                                    </button>
                                    <ul
                                        class="dropdown-menu dropdown-menu-end"
                                        aria-labelledby="storyboardDropdownBtn"
                                        id="storyboardDropdownMenu"
                                    >
                                        <li>
                                            <a
                                                class="dropdown-item"
                                                href="#"
                                                data-action="new"
                                                >🆕 新建故事板</a
                                            >
                                        </li>
                                        <li><hr class="dropdown-divider" /></li>
                                        <!-- 动态故事板列表将插入到这里 -->
                                    </ul>
                                </div>
                                <!-- 新增删除按钮（紧贴下拉按钮右侧） -->
                                <button
                                    id="deleteStoryboardBtn"
                                    class="btn btn-outline-danger ms-2"
                                    type="button"
                                    style="display: none"
                                    title="删除当前故事板"
                                >
                                    🗑️
                                </button>
                            </div>
                            <div class="d-flex gap-2">
                                <button
                                    id="addStoryboardPanelBtn"
                                    class="btn btn-outline-info btn-sm"
                                >
                                    + 添加分镜
                                </button>
                                <button
                                    id="saveStoryboardBtn"
                                    class="btn btn-primary btn-sm"
                                    disabled
                                >
                                    保存
                                </button>
                            </div>
                        </div>

                        <!-- 拖入提示 / 面板容器（不变） -->
                        <div
                            id="storyboardPlaceholder"
                            class="d-flex justify-content-center align-items-center text-muted py-5"
                            style="min-height: 300px"
                        >
                            🎞️ 点击右上角按钮添加分镜
                        </div>
                        <div
                            id="storyboardPanels"
                            class="row g-3"
                            style="display: none"
                        ></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 全局提示容器 -->
        <div
            id="globalToastContainer"
            class="position-fixed top-0 end-0 p-3"
            style="z-index: 1055; pointer-events: none"
        >
            <!-- 动态 toast 将被插入到这里 -->
        </div>

        <!-- 全屏遮罩（用于换脸等耗时操作） -->
        <div
            id="fullscreenMask"
            class="position-fixed top-0 start-0 w-100 h-100 d-none"
            style="
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 1050;
                display: none;
            "
        >
            <div class="d-flex justify-content-center align-items-center h-100">
                <div class="text-light text-center">
                    <div
                        class="spinner-border text-light mb-2"
                        role="status"
                    ></div>
                    <div>正在处理换脸，请稍候...</div>
                </div>
            </div>
        </div>

        <!-- 快捷访问窗口 -->
        <div id="quickAccessWindow" class="floating-window d-none">
            <div class="floating-header">
                <span>快捷访问</span>
                <button
                    type="button"
                    class="btn-close"
                    data-dismiss="quick-access"
                ></button>
            </div>
            <div class="quick-images-container"></div>
            <div class="resize-handle"></div>
        </div>

        <!-- 历史记录窗口 -->
        <div id="historyWindow" class="floating-window d-none">
            <div class="floating-header">
                <span>历史记录</span>
                <button
                    type="button"
                    class="btn-close"
                    data-dismiss="history-window"
                ></button>
            </div>
            <div class="history-content">
                <div id="historyWindowList" class="row"></div>
                <nav aria-label="历史翻页" class="mt-2">
                    <ul
                        class="pagination justify-content-center"
                        id="historyWindowPagination"
                    ></ul>
                </nav>
            </div>
            <div class="resize-handle"></div>
        </div>

        <!-- 图片详情Modal -->
        <div id="historyDetailModal" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content bg-dark text-light">
                    <div class="modal-header">
                        <h5 class="modal-title">历史记录详情</h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                        ></button>
                    </div>
                    <div class="modal-body"></div>
                    <div class="modal-footer"></div>
                </div>
            </div>
        </div>

        <!-- 区域编辑模态框 -->
        <div id="regionEditModal" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content bg-dark text-light">
                    <div class="modal-header">
                        <h5 class="modal-title">区域编辑</h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <!-- 编辑类型选择 -->
                        <div class="mb-3">
                            <label class="form-label">编辑类型</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="regionEditType"
                                        id="regionEditTypeFace"
                                        value="face_swap"
                                        checked
                                    />
                                    <label
                                        class="form-check-label"
                                        for="regionEditTypeFace"
                                        >换脸</label
                                    >
                                </div>
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="regionEditType"
                                        id="regionEditTypeImg2Img"
                                        value="img2img"
                                    />
                                    <label
                                        class="form-check-label"
                                        for="regionEditTypeImg2Img"
                                        >图生图</label
                                    >
                                </div>
                            </div>
                        </div>

                        <!-- 颜色匹配选项（已隐藏，如需恢复删除 style） -->
                        <div class="mb-3" style="display: none;">
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="enableColorMatch"
                                />
                                <label class="form-check-label" for="enableColorMatch">
                                    自动颜色匹配（使编辑结果色调与原图一致）
                                </label>
                            </div>
                            <div id="colorMatchMethodSection" class="mt-2 ms-4">
                                <label class="form-label small">匹配方法</label>
                                <select id="colorMatchMethod" class="form-select form-select-sm" style="width: auto;">
                                    <option value="mkl">MKL（推荐）</option>
                                    <option value="hm">直方图匹配</option>
                                    <option value="reinhard">Reinhard</option>
                                    <option value="mvgd">MVGD</option>
                                    <option value="hm-mvgd-hm">HM-MVGD-HM</option>
                                    <option value="hm-mkl-hm">HM-MKL-HM</option>
                                </select>
                            </div>
                        </div>

                        <!-- 边界融合选项 -->
                        <div class="mb-3">
                            <label class="form-label">边界融合</label>
                            <select id="seamlessMethod" class="form-select" style="width: auto;">
                                <option value="none">不融合（直接覆盖）</option>
                                <option value="feather">羽化边缘（透明渐变）</option>
                                <option value="poisson_normal" selected>泊松融合 - 正常模式（推荐）</option>
                                <option value="poisson_mixed">泊松融合 - 混合模式</option>
                            </select>
                            <div id="featherRadiusSection" class="mt-2" style="display: none;">
                                <label class="form-label small">羽化半径: <span id="featherRadiusValue">10</span>px</label>
                                <input type="range" class="form-range" id="featherRadius" min="1" max="50" value="10" style="max-width: 200px;">
                            </div>
                        </div>

                        <!-- 换脸选项 -->
                        <div id="regionFaceSwapSection">
                            <label class="form-label">选择参考面部</label>
                            <div id="regionFaceSwapOptions" class="row">
                                <!-- 动态填充 -->
                            </div>
                        </div>

                        <!-- 图生图选项 -->
                        <div id="regionImg2ImgSection" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label">提示词</label>
                                <textarea
                                    id="regionImg2ImgPrompt"
                                    class="form-control"
                                    rows="3"
                                    placeholder="请输入提示词..."
                                ></textarea>
                            </div>
                            <!-- 新增参考图片区域 -->
                            <div class="mb-3">
                                <label class="form-label">新增参考图（可选）</label>
                                <input
                                    type="file"
                                    id="regionImg2ImgExtraUpload"
                                    multiple
                                    accept="image/*"
                                    class="d-none"
                                />
                                <div
                                    id="regionImg2ImgDropZone"
                                    class="dashed-upload text-center py-2 mb-2"
                                    style="cursor: pointer; border-style: dashed; border-width: 2px; border-radius: 4px;"
                                >
                                    <div class="text-muted small">
                                        + 点击添加参考图
                                    </div>
                                </div>
                                <div id="regionImg2ImgExtraList" class="d-flex flex-wrap gap-2">
                                    <!-- 动态填充 -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="confirmRegionEdit">确认编辑</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
        <script src="{{ url_for('static', filename='state.js') }}"></script>
        <script src="{{ url_for('static', filename='film-manager.js') }}"></script>
        <script src="{{ url_for('static', filename='plugin-settings.js') }}"></script>
        <script src="{{ url_for('static', filename='upload.js') }}"></script>
        <script src="{{ url_for('static', filename='quick-access.js') }}"></script>
        <script src="{{ url_for('static', filename='image-edit/core.js') }}"></script>
        <script src="{{ url_for('static', filename='image-edit/utils.js') }}"></script>
        <script src="{{ url_for('static', filename='image-edit/crop-mode.js') }}"></script>
        <script src="{{ url_for('static', filename='image-edit/region-mode.js') }}"></script>
        <script src="{{ url_for('static', filename='image-edit/main.js') }}"></script>
        <script src="{{ url_for('static', filename='storyboard.js') }}"></script>
        <script src="{{ url_for('static', filename='main.js') }}"></script>
    </body>
</html>
